[package]
name = "pump-parser-core"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[features]
default = ["chrono"]
chrono = ["dep:chrono"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", optional = true }